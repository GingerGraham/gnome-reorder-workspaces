name: Node.js EOL Alert
description: Automated Node.js end-of-life or non-LTS version warning (opened by node-eol.yml workflow)
labels:
  - node-eol
  - dependencies
  - ci
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **This issue was opened automatically by the `node-eol.yml` workflow.**
        > Do not close it until the Node.js version has been updated and the PR merged.

  - type: input
    id: current-version
    attributes:
      label: Current Node.js version
      placeholder: "e.g. 23 (23.11.0 in .node-version)"
    validations:
      required: true

  - type: input
    id: eol-date
    attributes:
      label: EOL date
      placeholder: "e.g. 2026-06-01"
    validations:
      required: true

  - type: dropdown
    id: reason
    attributes:
      label: Reason for this issue
      options:
        - "EOL reached — version is no longer supported"
        - "EOL within 90 days — upgrade should be planned"
        - "Non-LTS version in use — should switch to LTS"
    validations:
      required: true

  - type: input
    id: workflow-run
    attributes:
      label: Workflow run URL
      description: Link to the node-eol.yml run that opened this issue

  - type: checkboxes
    id: checklist
    attributes:
      label: Resolution checklist
      options:
        - label: Determine target LTS version at https://endoflife.date/nodejs
        - label: Update `.node-version` to new full semver
        - label: Update `.devcontainer/Dockerfile` base image major
        - label: Verify `install.yml` and `lint.yml` pass on the PR
        - label: Update `CHANGELOG.md` under `[Unreleased]`
        - label: PR merged — close this issue

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any additional context, blockers, or observations
